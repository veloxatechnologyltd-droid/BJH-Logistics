packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
# Patched versions of packages Next.js pulls in (advisories on 16.3.8's own pins).
overrides:
  sharp: ">=0.35.5"
  source-map-js: ">=1.2.2"
minimumReleaseAgeExclude:
  - "@nestjs/cli@12.0.8"
  - "@nestjs/common@12.1.1"
  - "@nestjs/core@12.1.1"
  - "@nestjs/platform-express@12.1.1"
  - "@nestjs/testing@12.1.1"
