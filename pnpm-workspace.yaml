packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
# Patched versions of packages Next.js pulls in (advisories on 16.3.8's own pins).
overrides:
  sharp: ">=0.35.5"
  source-map-js: ">=1.2.2"
  # Patched versions within the ranges express and @anthropic-ai/sdk accept
  # (2026-11-02 audit: body-parser and zod denial of service, qs crash).
  body-parser: ">=2.4.0 <3"
  qs: ">=6.16.1 <7"
  zod: ">=4.6.6 <5"
minimumReleaseAgeExclude:
  - "@nestjs/cli@12.0.8"
